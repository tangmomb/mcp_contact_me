name: Test and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mcp-contact-me-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Configure restricted SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/mcp_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/mcp_deploy ~/.ssh/known_hosts

      - name: Deploy tested revision
        run: |
          ssh \
            -i ~/.ssh/mcp_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            mcp-deploy@mcp-contact-me.tanguym.fr "deploy ${GITHUB_SHA}"
