[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-contact-me"
version = "0.1.0"
description = "Serveur MCP permettant aux projets IA de contacter leur propriétaire."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "pydantic-settings>=2.12,<3",
    "uvicorn>=0.31,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
]

[project.scripts]
mcp-contact-me = "mcp_contact_me.server:main"
mcp-contact-token = "mcp_contact_me.token_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_contact_me"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
